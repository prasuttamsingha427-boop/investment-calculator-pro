workflows:
  android-workflow:
    name: Investment Calculator Pro
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Create Android project files
        script: flutter create . --platforms=android --project-name investment_calculator_pro

      - name: Get dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
